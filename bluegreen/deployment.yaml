apiVersion: apps/v1
kind: Deployment
metadata:
  name: bg-app-COLOR
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bg-app
      color: COLOR
  template:
    metadata:
      labels:
        app: bg-app
        color: COLOR
    spec:
      containers:
      - name: bg-app
        image: IMAGE_TAG
        ports:
        - containerPort: 3000
        env:
        - name: COLOR
          value: "COLOR"
        - name: BUILD
          value: "BUILD_NUM"
