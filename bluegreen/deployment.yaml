apiVersion: apps/v1
kind: Deployment
metadata:
  name: bg-app-__COLOR__
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bg-app
      color: __COLOR__
  template:
    metadata:
      labels:
        app: bg-app
        color: __COLOR__
    spec:
      containers:
      - name: bg-app
        image: IMAGE_TAG
        ports:
        - containerPort: 3000
        env:
        - name: COLOR
          value: "__COLOR__"
        - name: BUILD
          value: "BUILD_NUM"
